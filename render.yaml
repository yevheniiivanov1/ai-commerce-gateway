# Render Blueprint: render.com → New → Blueprint → this repository → Apply.
services:
  - type: web
    name: vsa-ai-gateway
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Absolute links in tool results; without it they follow the proxy's X-Forwarded-Host.
      - key: Gateway__PublicBaseUrl
        value: https://vsa-ai-gateway.onrender.com/
